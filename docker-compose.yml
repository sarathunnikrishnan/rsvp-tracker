services:
  db:
    image: mysql:8.0
    container_name: meetup_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-meetup_tracker}
      MYSQL_USER: ${DB_USER:-dexqbit_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dexqbit_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetup_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-dexqbit_user}
      DB_PASSWORD: ${DB_PASSWORD:-dexqbit_password}
      DB_NAME: ${DB_NAME:-meetup_tracker}
      DB_SSL: ${DB_SSL:-}
      DB_SSL_MODE_KEYWORD: ${DB_SSL_MODE_KEYWORD:-}
      DB_CLOUD_HOST_KEYWORD: ${DB_CLOUD_HOST_KEYWORD:-}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_dexqbit_2026_meetup_tracker}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetup_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mysql_data:
